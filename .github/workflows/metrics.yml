name: Metrics

on:
  # Run daily at 00:00 ART (03:00 UTC)
  schedule:
    - cron: "0 3 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate overview, lines & notable contributions
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Argentina/Buenos_Aires
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_notable: yes
          plugin_notable_from: all

      - name: Generate languages breakdown
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, lines
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%

      - name: Generate isometric calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
