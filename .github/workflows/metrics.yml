name: Metrics

on:
  # Run daily at 00:00 ART (03:00 UTC)
  schedule:
    - cron: "0 3 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # shortcut: patches v3.34 image for lowlighter/metrics#1843, remove if upstream releases a fix
      - name: Patch lowlighter/metrics lines plugin
        run: |
          docker build -t metrics:3.34.0 - <<'EOF'
          FROM ghcr.io/lowlighter/metrics:v3.34
          RUN sed -i 's/if (data\.account)/if (data.account === "organization")/; s/contributor\.author\.login/(contributor.author?.login ?? "ghost")/' /metrics/source/plugins/lines/index.mjs \
           && sed -i 's/((plugins\.lines\.sections\.includes/((plugins.lines.error)||(plugins.lines.sections?.includes/; s/plugins\.lines\.sections\.includes/plugins.lines.sections?.includes/g' /metrics/source/templates/classic/partials/lines.ejs \
           && grep -q 'data.account === "organization"' /metrics/source/plugins/lines/index.mjs \
           && grep -q 'contributor.author?.login' /metrics/source/plugins/lines/index.mjs \
           && grep -q 'plugins.lines.error' /metrics/source/templates/classic/partials/lines.ejs \
           && node --check /metrics/source/plugins/lines/index.mjs
          EOF

      - name: Generate overview, lines & notable contributions
        uses: lowlighter/metrics@v3.34
        with:
          use_prebuilt_image: no
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Argentina/Buenos_Aires
          plugin_lines: yes
          plugin_lines_sections: base, repositories
          plugin_notable: yes
          plugin_notable_from: all

      - name: Generate languages breakdown
        uses: lowlighter/metrics@v3.34
        with:
          use_prebuilt_image: no
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: percentage, lines
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%

      - name: Generate isometric calendar
        uses: lowlighter/metrics@v3.34
        with:
          use_prebuilt_image: no
          filename: metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main
          user: fumoctl
          template: classic
          base: ""
          config_timezone: America/Argentina/Buenos_Aires
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
